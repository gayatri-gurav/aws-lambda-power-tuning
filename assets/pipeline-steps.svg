<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" role="img" aria-label="Auto-playing 9-step AWS Lambda Power Tuning execution flow diagram">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="progGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" opacity="0.6"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrHi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>

    <style>
      .f { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .hdr { font-size: 15px; font-weight: 700; fill: #f8fafc; }
      .sub { font-size: 11px; fill: #94a3b8; }
      .phase { font-size: 10.5px; font-weight: 700; fill: #64748b; letter-spacing: 0.7px; }
      .tag { font-size: 9.5px; font-weight: 700; letter-spacing: 0.5px; fill: #94a3b8; }
      .ntitle { font-size: 12.5px; font-weight: 700; fill: #f8fafc; }
      .nsub { font-size: 10.5px; fill: #94a3b8; }
      .cap-title { font-size: 13px; font-weight: 700; fill: #f8fafc; }
      .cap-file { font-size: 10.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #7dd3fc; }
      .cap-desc { font-size: 11.5px; fill: #cbd5e1; }
      .cap-why { font-size: 11px; font-weight: 600; fill: #34d399; }

      .card-base { fill: #131c31; stroke: #24324a; stroke-width: 1.4; }

      /* Active glow border overlay per step (18s loop, 2s per step) */
      .card-hi {
        fill: none;
        stroke: #38bdf8;
        stroke-width: 2.5;
        opacity: 0;
        animation: hiPulse 18s linear infinite;
      }
      @keyframes hiPulse {
        0%, 10.5% { opacity: 1; }
        11.8%, 99% { opacity: 0; }
        100% { opacity: 1; }
      }

      /* Animated flowing connectors */
      .edge-base {
        fill: none;
        stroke: #334155;
        stroke-width: 2;
      }
      .edge-hi {
        fill: none;
        stroke: #38bdf8;
        stroke-width: 2.5;
        stroke-dasharray: 6 4;
        opacity: 0;
        animation: hiPulse 18s linear infinite, march 0.8s linear infinite;
      }
      @keyframes march {
        from { stroke-dashoffset: 20; }
        to { stroke-dashoffset: 0; }
      }

      /* Auto-cycling caption per step */
      .caption {
        opacity: 0;
        animation: capShow 18s linear infinite;
      }
      @keyframes capShow {
        0%, 10.4% { opacity: 1; }
        11.3%, 99.2% { opacity: 0; }
        100% { opacity: 1; }
      }

      /* Smooth progress bar */
      .prog-fill {
        transform-origin: 24px 0px;
        animation: progBar 18s linear infinite;
      }
      @keyframes progBar {
        from { transform: scaleX(0.02); }
        to { transform: scaleX(1); }
      }

      /* Delays so Step 1 starts immediately at t=0, then 2..9 every 2s */
      .d1 { animation-delay: 0s; }
      .d2 { animation-delay: -16s; }
      .d3 { animation-delay: -14s; }
      .d4 { animation-delay: -12s; }
      .d5 { animation-delay: -10s; }
      .d6 { animation-delay: -8s; }
      .d7 { animation-delay: -6s; }
      .d8 { animation-delay: -4s; }
      .d9 { animation-delay: -2s; }

      .dot-live { animation: blink 1.6s ease-in-out infinite; }
      @keyframes blink { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    </style>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="960" height="390" rx="14" fill="url(#bg)"/>
  <rect x="0" y="0" width="960" height="390" rx="14" fill="url(#grid)"/>
  <rect x="1" y="1" width="958" height="388" rx="13" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Header -->
  <rect x="0" y="0" width="960" height="44" rx="14" fill="#0f172a" opacity="0.9"/>
  <line x1="0" y1="44" x2="960" y2="44" stroke="#1e293b" stroke-width="1"/>
  <circle cx="24" cy="22" r="5" fill="#38bdf8" class="dot-live" filter="url(#glow)"/>
  <text x="38" y="27" class="f hdr">9-Step Automated Power Tuning Walkthrough</text>
  <rect x="784" y="11" width="154" height="22" rx="11" fill="#131c31" stroke="#334155" stroke-width="1"/>
  <circle cx="798" cy="22" r="3.5" fill="#34d399" class="dot-live"/>
  <text x="808" y="26" class="f sub" fill="#cbd5e1">Auto-Playing Loop (18s)</text>

  <!-- Phase Labels -->
  <text x="24" y="64" class="f phase">PHASE 1: DEPLOY &amp; BENCHMARK</text>
  <text x="24" y="182" class="f phase">PHASE 2: GOVERN, APPLY &amp; VERIFY</text>

  <!-- Connectors Row 1 -->
  <path d="M 180 107 L 208 107" class="edge-base" marker-end="url(#arr)"/>
  <path d="M 180 107 L 208 107" class="edge-hi d2" marker-end="url(#arrHi)"/>

  <path d="M 364 107 L 392 107" class="edge-base" marker-end="url(#arr)"/>
  <path d="M 364 107 L 392 107" class="edge-hi d3" marker-end="url(#arrHi)"/>

  <path d="M 548 107 L 576 107" class="edge-base" marker-end="url(#arr)"/>
  <path d="M 548 107 L 576 107" class="edge-hi d4" marker-end="url(#arrHi)"/>

  <path d="M 732 107 L 760 107" class="edge-base" marker-end="url(#arr)"/>
  <path d="M 732 107 L 760 107" class="edge-hi d5" marker-end="url(#arrHi)"/>

  <!-- Z-Connector Row 1 -> Row 2 -->
  <path d="M 848 141 L 848 162 L 122 162 L 122 192" class="edge-base" marker-end="url(#arr)"/>
  <path d="M 848 141 L 848 162 L 122 162 L 122 192" class="edge-hi d6" marker-end="url(#arrHi)"/>

  <!-- Connectors Row 2 -->
  <path d="M 220 228 L 260 228" class="edge-base" marker-end="url(#arr)"/>
  <path d="M 220 228 L 260 228" class="edge-hi d7" marker-end="url(#arrHi)"/>

  <path d="M 456 228 L 496 228" class="edge-base" marker-end="url(#arr)"/>
  <path d="M 456 228 L 496 228" class="edge-hi d8" marker-end="url(#arrHi)"/>

  <path d="M 692 228 L 732 228" class="edge-base" marker-end="url(#arr)"/>
  <path d="M 692 228 L 732 228" class="edge-hi d9" marker-end="url(#arrHi)"/>

  <!-- ==================== ROW 1 NODES (y=73, h=68) ==================== -->
  <!-- Step 1 -->
  <g transform="translate(24, 73)">
    <rect width="156" height="68" rx="10" class="card-base"/>
    <rect width="156" height="68" rx="10" class="card-hi d1" filter="url(#glow)"/>
    <circle cx="18" cy="19" r="8" fill="#6366f1"/>
    <text x="18" y="22.5" text-anchor="middle" class="f" font-size="10" font-weight="700" fill="#fff">1</text>
    <text x="32" y="22.5" class="f tag">GITHUB</text>
    <text x="14" y="43" class="f ntitle">Push / Run</text>
    <text x="14" y="58" class="f nsub">Verify approver</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(208, 73)">
    <rect width="156" height="68" rx="10" class="card-base"/>
    <rect width="156" height="68" rx="10" class="card-hi d2" stroke="#14b8a6" filter="url(#glow)"/>
    <circle cx="18" cy="19" r="8" fill="#14b8a6"/>
    <text x="18" y="22.5" text-anchor="middle" class="f" font-size="10" font-weight="700" fill="#fff">2</text>
    <text x="32" y="22.5" class="f tag">OIDC AUTH</text>
    <text x="14" y="43" class="f ntitle">AWS IAM Role</text>
    <text x="14" y="58" class="f nsub">Zero static keys</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(392, 73)">
    <rect width="156" height="68" rx="10" class="card-base"/>
    <rect width="156" height="68" rx="10" class="card-hi d3" stroke="#a855f7" filter="url(#glow)"/>
    <circle cx="18" cy="19" r="8" fill="#a855f7"/>
    <text x="18" y="22.5" text-anchor="middle" class="f" font-size="10" font-weight="700" fill="#fff">3</text>
    <text x="32" y="22.5" class="f tag">TERRAFORM</text>
    <text x="14" y="43" class="f ntitle">Deploy Stack</text>
    <text x="14" y="58" class="f nsub">API · Lambda · DDB</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(576, 73)">
    <rect width="156" height="68" rx="10" class="card-base"/>
    <rect width="156" height="68" rx="10" class="card-hi d4" stroke="#d946ef" filter="url(#glow)"/>
    <circle cx="18" cy="19" r="8" fill="#d946ef"/>
    <text x="18" y="22.5" text-anchor="middle" class="f" font-size="10" font-weight="700" fill="#fff">4</text>
    <text x="32" y="22.5" class="f tag">STEP FN (SAR)</text>
    <text x="14" y="43" class="f ntitle">Power Tuner</text>
    <text x="14" y="58" class="f nsub">128–1024 MB × 20</text>
  </g>

  <!-- Step 5 -->
  <g transform="translate(760, 73)">
    <rect width="176" height="68" rx="10" class="card-base"/>
    <rect width="176" height="68" rx="10" class="card-hi d5" stroke="#818cf8" filter="url(#glow)"/>
    <circle cx="18" cy="19" r="8" fill="#818cf8"/>
    <text x="18" y="22.5" text-anchor="middle" class="f" font-size="10" font-weight="700" fill="#fff">5</text>
    <text x="32" y="22.5" class="f tag">EVIDENCE</text>
    <text x="14" y="43" class="f ntitle">Generate Reports</text>
    <text x="14" y="58" class="f nsub">Cost vs. latency curve</text>
  </g>

  <!-- ==================== ROW 2 NODES (y=194, h=68) ==================== -->
  <!-- Step 6 -->
  <g transform="translate(24, 194)">
    <rect width="196" height="68" rx="10" class="card-base"/>
    <rect width="196" height="68" rx="10" class="card-hi d6" stroke="#f59e0b" filter="url(#glow)"/>
    <circle cx="18" cy="19" r="8" fill="#f59e0b"/>
    <text x="18" y="22.5" text-anchor="middle" class="f" font-size="10" font-weight="700" fill="#0b1120">6</text>
    <text x="32" y="22.5" class="f tag">GOVERNANCE</text>
    <text x="14" y="43" class="f ntitle">Approval Gate</text>
    <text x="14" y="58" class="f nsub" fill="#fcd34d">ask_approval (Issue)</text>
  </g>

  <!-- Step 7 -->
  <g transform="translate(260, 194)">
    <rect width="196" height="68" rx="10" class="card-base"/>
    <rect width="196" height="68" rx="10" class="card-hi d7" stroke="#ff9900" filter="url(#glow)"/>
    <circle cx="18" cy="19" r="8" fill="#ff9900"/>
    <text x="18" y="22.5" text-anchor="middle" class="f" font-size="10" font-weight="700" fill="#0b1120">7</text>
    <text x="32" y="22.5" class="f tag">OPTIMIZE</text>
    <text x="14" y="43" class="f ntitle">Update Memory</text>
    <text x="14" y="58" class="f nsub">Apply optimal MB live</text>
  </g>

  <!-- Step 8 -->
  <g transform="translate(496, 194)">
    <rect width="196" height="68" rx="10" class="card-base"/>
    <rect width="196" height="68" rx="10" class="card-hi d8" stroke="#f97316" filter="url(#glow)"/>
    <circle cx="18" cy="19" r="8" fill="#f97316"/>
    <text x="18" y="22.5" text-anchor="middle" class="f" font-size="10" font-weight="700" fill="#fff">8</text>
    <text x="32" y="22.5" class="f tag">VALIDATION</text>
    <text x="14" y="43" class="f ntitle">Newman API Tests</text>
    <text x="14" y="58" class="f nsub">GET · POST · GET CRUD</text>
  </g>

  <!-- Step 9 -->
  <g transform="translate(732, 194)">
    <rect width="204" height="68" rx="10" class="card-base"/>
    <rect width="204" height="68" rx="10" class="card-hi d9" stroke="#10b981" filter="url(#glow)"/>
    <circle cx="18" cy="19" r="8" fill="#10b981"/>
    <text x="18" y="22.5" text-anchor="middle" class="f" font-size="10" font-weight="700" fill="#0b1120">9</text>
    <text x="32" y="22.5" class="f tag">AUDIT ARCHIVE</text>
    <text x="14" y="43" class="f ntitle">S3 + Artifacts</text>
    <text x="14" y="58" class="f nsub" fill="#6ee7b7">Versioned + KMS FinOps</text>
  </g>

  <!-- ==================== LIVE AUTO-CYCLING CAPTION BAR ==================== -->
  <rect x="24" y="280" width="912" height="86" rx="10" fill="#111a2e" stroke="#24324a" stroke-width="1.2"/>

  <!-- Caption 1 -->
  <g class="caption d1">
    <text x="40" y="304" class="f cap-title">Step 1 / 9 — Trigger &amp; Deploy Guard (GitHub Actions)</text>
    <text x="920" y="304" text-anchor="end" class="cap-file">.github/workflows/power-tune.yml</text>
    <text x="40" y="326" class="f cap-desc">Push to main or manual Run workflow checks DEPLOY_APPROVER and packages lambda/app.py into package.zip.</text>
    <text x="40" y="348" class="f cap-why">Benefit: Blocks unauthorized deployments before touching AWS.</text>
  </g>

  <!-- Caption 2 -->
  <g class="caption d2">
    <text x="40" y="304" class="f cap-title">Step 2 / 9 — Keyless AWS Login via OIDC (GitHub → AWS STS)</text>
    <text x="920" y="304" text-anchor="end" class="cap-file">scripts/setup-powertuner-oidc.sh</text>
    <text x="40" y="326" class="f cap-desc">GitHub exchanges a short-lived signed OIDC JWT for temporary STS credentials on github-oidc-deploy-role.</text>
    <text x="40" y="348" class="f cap-why">Benefit: Zero static AWS access keys stored in GitHub Secrets.</text>
  </g>

  <!-- Caption 3 -->
  <g class="caption d3">
    <text x="40" y="304" class="f cap-title">Step 3 / 9 — Terraform Infrastructure Deploy (AWS us-east-1)</text>
    <text x="920" y="304" text-anchor="end" class="cap-file">infra/terraform/*.tf</text>
    <text x="40" y="326" class="f cap-desc">Provisions API Gateway, Python 3.11 Lambda, DynamoDB, KMS S3 reports bucket, and the SAR Power Tuner stack.</text>
    <text x="40" y="348" class="f cap-why">Benefit: 100% reproducible Infrastructure as Code with S3 state + DynamoDB locking.</text>
  </g>

  <!-- Caption 4 -->
  <g class="caption d4">
    <text x="40" y="304" class="f cap-title">Step 4 / 9 — AWS Lambda Power Tuning Benchmark (Step Functions)</text>
    <text x="920" y="304" text-anchor="end" class="cap-file">infra/terraform/cloudformation-SAR.tf</text>
    <text x="40" y="326" class="f cap-desc">Invokes Lambda 20x in parallel across 128, 256, 512, and 1024 MB to measure real cost and latency curves.</text>
    <text x="40" y="348" class="f cap-why">Benefit: More memory adds vCPU — 1024 MB delivers ~4x faster latency at comparable cost.</text>
  </g>

  <!-- Caption 5 -->
  <g class="caption d5">
    <text x="40" y="304" class="f cap-title">Step 5 / 9 — Generate Evidence Reports (JSON, HTML &amp; Markdown)</text>
    <text x="920" y="304" text-anchor="end" class="cap-file">reports/memory-change-summary.md</text>
    <text x="40" y="326" class="f cap-desc">Creates an interactive Cost-vs-Latency chart link and compares current vs. recommended Lambda memory.</text>
    <text x="40" y="348" class="f cap-why">Benefit: Evidence-backed recommendations for Architects, SREs, and FinOps reviews.</text>
  </g>

  <!-- Caption 6 -->
  <g class="caption d6">
    <text x="40" y="304" class="f cap-title">Step 6 / 9 — Human Approval Gate (ask_approval Governance Toggle)</text>
    <text x="920" y="304" text-anchor="end" class="cap-file">infra/terraform/variables.tf</text>
    <text x="40" y="326" class="f cap-desc">When ask_approval = true, opens a GitHub Issue and pauses until an approver comments "approve" or "deny".</text>
    <text x="40" y="348" class="f cap-why">Benefit: Aligns automated optimization with enterprise CAB &amp; change-control policies.</text>
  </g>

  <!-- Caption 7 -->
  <g class="caption d7">
    <text x="40" y="304" class="f cap-title">Step 7 / 9 — Apply Optimal Memory to Live Lambda Function</text>
    <text x="920" y="304" text-anchor="end" class="cap-file">.github/workflows/power-tune.yml</text>
    <text x="40" y="326" class="f cap-desc">Runs aws lambda update-function-configuration --memory-size &lt;BEST&gt; to apply the winning profile.</text>
    <text x="40" y="348" class="f cap-why">Benefit: Closes the optimization loop automatically with zero manual console edits.</text>
  </g>

  <!-- Caption 8 -->
  <g class="caption d8">
    <text x="40" y="304" class="f cap-title">Step 8 / 9 — Real API Smoke &amp; Load Validation (Postman + Newman)</text>
    <text x="920" y="304" text-anchor="end" class="cap-file">postman/collection.json</text>
    <text x="40" y="326" class="f cap-desc">Executes live CRUD calls (GET /items, POST /items, GET /items/{id}) against API Gateway to verify 0% errors.</text>
    <text x="40" y="348" class="f cap-why">Benefit: Validates real customer-facing API latency and correctness post-tuning.</text>
  </g>

  <!-- Caption 9 -->
  <g class="caption d9">
    <text x="40" y="304" class="f cap-title">Step 9 / 9 — Archive Audit Trail (Versioned KMS S3 + GitHub Artifacts)</text>
    <text x="920" y="304" text-anchor="end" class="cap-file">infra/terraform/s3-powertuning-reports.tf</text>
    <text x="40" y="326" class="f cap-desc">Uploads timestamped benchmark JSONs, charts, summaries, and Newman reports to encrypted S3 &amp; Artifacts.</text>
    <text x="40" y="348" class="f cap-why">Benefit: Permanent FinOps &amp; governance trail ready for Athena or QuickSight analytics.</text>
  </g>

  <!-- Smooth Loop Progress Bar -->
  <rect x="24" y="374" width="912" height="4" rx="2" fill="#1e293b"/>
  <rect x="24" y="374" width="912" height="4" rx="2" fill="url(#progGrad)" class="prog-fill"/>
</svg>
